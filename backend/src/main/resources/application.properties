spring.application.name=krproject01
# MySQL 접속 주소
spring.datasource.url=jdbc:mysql://localhost:3306/rk_project1_db
# DB 아이디
spring.datasource.username=root
# DB 비밀번호
spring.datasource.password=4068
# 테이블 자동 생성 (개발용)
spring.jpa.hibernate.ddl-auto=update
# 실행 SQL 콘솔 출력
spring.jpa.show-sql=true
# SQL 보기 좋게 정렬
spring.jpa.properties.hibernate.format_sql=true
#로그 설정
logging.level.root=info
logging.file.name=logs/mylog.log
